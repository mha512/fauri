<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241A" />
      <stop offset="100%" stop-color="#0F4C3A" />
    </linearGradient>
    <linearGradient id="sparkGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Logomark Symbol (Left) -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="60" height="60" rx="18" fill="url(#bgGradL)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Stylized Urdu Fé Loop -->
    <circle cx="36" cy="24" r="7" stroke="url(#sparkGradL)" stroke-width="3" fill="none"/>
    <!-- Dot of Fé -->
    <circle cx="36" cy="13" r="2.8" fill="url(#amberGradL)"/>
    
    <!-- Tail of Fé -->
    <path d="M36 31 C35 40 26 44 19 44 C14 44 12 41 14 38 C16 36 19 36 23 37 C27 38 31 37 32 30" 
          stroke="url(#sparkGradL)" stroke-width="3" stroke-linecap="round" fill="none"/>
    
    <!-- Lightning Bolt -->
    <path d="M43 36 L50 36 L46 44 L53 44 L41 54 L44 46 L38 46 Z" fill="url(#amberGradL)"/>
  </g>

  <!-- Brand Typography (Latin + Urdu) for Light Backgrounds -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="30" font-weight="800" fill="#06241A" letter-spacing="-0.5">Fauri</text>
  <text x="172" y="44" font-family="'Noto Nastaliq Urdu', serif" font-size="28" font-weight="700" fill="#0F766E" direction="rtl">فوری</text>
  
  <!-- Subtitle Tagline -->
  <text x="84" y="61" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">CUSTOMER MESSAGE TRIAGE</text>
  
  <!-- Active Status Dot -->
  <circle cx="270" cy="58" r="3.5" fill="#10B981"/>
</svg>
