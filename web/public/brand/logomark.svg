<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06241A" />
      <stop offset="100%" stop-color="#0F4C3A" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#bgGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Subtle Message Bubble Shape -->
  <path d="M26 32 C26 25 32 20 40 20 L62 20 C71 20 78 26 78 35 C78 44 71 50 62 50 L42 50 L30 62 L32 50 C28 48 26 43 26 38 Z" 
        fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- Stylized Urdu Fé (ف) & Speed Spark -->
  <!-- The Loop of Fé (Head) -->
  <circle cx="58" cy="38" r="10" stroke="url(#sparkGrad)" stroke-width="4.5" fill="none" filter="url(#glow)"/>
  <!-- The Nuqta (Dot of Fé) -->
  <circle cx="58" cy="22" r="4" fill="url(#amberGrad)"/>

  <!-- The Elegant Sweeping Tail of Fé converting into forward triage sweep -->
  <path d="M58 48 C56 62 44 68 32 68 C24 68 20 64 22 60 C24 56 30 56 36 58 C42 60 50 58 52 46" 
        stroke="url(#sparkGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Instantaneous Triage Lightning Dart -->
  <path d="M68 56 L78 56 L72 68 L82 68 L66 84 L70 72 L62 72 Z" 
        fill="url(#amberGrad)"/>
</svg>
